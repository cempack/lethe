<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/><stop offset="0.62" stop-color="#101116"/><stop offset="1" stop-color="#1a1d26"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#aebbd4" stop-opacity="0.50"/><stop offset="0.45" stop-color="#6f7f9f" stop-opacity="0.22"/><stop offset="1" stop-color="#6f7f9f" stop-opacity="0"/></radialGradient>
    <radialGradient id="haze"><stop offset="0" stop-color="#44527a" stop-opacity="0.40"/><stop offset="1" stop-color="#44527a" stop-opacity="0"/></radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0d11" stop-opacity="0"/><stop offset="1" stop-color="#050507" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- last light on the horizon -->
  <ellipse cx="960" cy="770" rx="1500" ry="330" fill="url(#haze)"/>
  <ellipse cx="960" cy="765" rx="900" ry="210" fill="url(#glow)"/>
  <rect y="770" width="1920" height="310" fill="url(#water)"/>
  <g fill="#f5f5f7" transform="translate(896 300) scale(0.5)">
    <path d="M78 122 a50 50 0 0 1 100 0 z"/>
    <rect x="78" y="134" width="100" height="9" rx="4.5" opacity="0.72"/>
    <rect x="94" y="153" width="68" height="9" rx="4.5" opacity="0.42"/>
    <rect x="110" y="172" width="36" height="9" rx="4.5" opacity="0.20"/>
  </g>
  <text x="960" y="446" text-anchor="middle" font-family="'SF Pro Display', Inter, Cantarell, 'DejaVu Sans', sans-serif"
        font-size="30" font-weight="500" letter-spacing="0.5" fill="#f5f5f7" opacity="0.92">Lethe</text>
</svg>
