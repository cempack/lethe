<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1600" width="2560" height="1600">
  <!-- Lethe, the river of forgetting, at dusk: the last light on the horizon and its
       reflection breaking up on still water. No logo, no text; graphite and steel. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050609"/><stop offset="0.38" stop-color="#0a0d15"/>
      <stop offset="0.6" stop-color="#151c2e"/><stop offset="0.68" stop-color="#232c42"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d3dcef" stop-opacity="0.70"/><stop offset="0.35" stop-color="#8196bf" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#3b4766" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8c9a8" stop-opacity="0.16"/><stop offset="1" stop-color="#e8c9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262e44"/><stop offset="1" stop-color="#10131c"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2030"/><stop offset="0.45" stop-color="#0d1018"/><stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfe6f5" stop-opacity="0"/><stop offset="0.5" stop-color="#dfe6f5" stop-opacity="1"/>
      <stop offset="1" stop-color="#dfe6f5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="mist" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="edge" x="-5%" y="-50%" width="110%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="2560" height="1600" fill="url(#sky)"/>

  <!-- the light, just below the horizon -->
  <ellipse cx="1280" cy="1090" rx="1500" ry="300" fill="url(#glow)" filter="url(#soft)"/>
  <ellipse cx="1280" cy="1085" rx="620" ry="120" fill="url(#warm)" filter="url(#mist)"/>

  <!-- distant hills, half lost in the haze -->
  <path d="M0 1030 C 300 985, 620 1000, 900 1040 S 1500 1062, 1700 1040 S 2250 985, 2560 1000 V 1600 H 0 Z"
        fill="#2a334a" opacity="0.45" filter="url(#edge)"/>
  <!-- far shore: two long, low swells -->
  <path d="M0 1062 C 420 1010, 820 1040, 1180 1068 S 1980 1046, 2560 1020 V 1600 H 0 Z" fill="url(#far)" opacity="0.92"/>
  <path d="M0 1062 C 420 1010, 820 1040, 1180 1068 S 1980 1046, 2560 1020" fill="none" stroke="#a9b8d6"
        stroke-opacity="0.22" stroke-width="2" filter="url(#edge)"/>

  <!-- the water -->
  <path d="M0 1110 C 640 1098, 1920 1098, 2560 1110 V 1600 H 0 Z" fill="url(#near)"/>

  <!-- the reflection, breaking up as it comes closer -->
  <g filter="url(#edge)">
    <rect x="1020" y="1128" width="520" height="5" rx="2.5" fill="url(#streak)" opacity="0.30"/>
    <rect x="1080" y="1162" width="400" height="5" rx="2.5" fill="url(#streak)" opacity="0.20"/>
    <rect x="1140" y="1202" width="280" height="5" rx="2.5" fill="url(#streak)" opacity="0.13"/>
    <rect x="1195" y="1250" width="170" height="5" rx="2.5" fill="url(#streak)" opacity="0.08"/>
  </g>
  <ellipse cx="1280" cy="1150" rx="700" ry="70" fill="url(#glow)" opacity="0.35" filter="url(#mist)"/>

  <rect width="2560" height="1600" fill="url(#vignette)"/>
</svg>
